name: TalkBack smoke

on:
  workflow_dispatch:
    inputs:
      target_origin:
        description: Origin to test (production or a public candidate URL)
        required: false
        default: https://play-100-collection.vercel.app
  push:
    branches: [leultew-r24-talkback]

permissions:
  contents: read

concurrency:
  group: talkback-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  talkback:
    name: TalkBack (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis]
    env:
      TARGET_ORIGIN: ${{ inputs.target_origin || 'https://play-100-collection.vercel.app' }}
      OUT: artifacts/talkback-${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/talkback-smoke/probe.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: talkback-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn
