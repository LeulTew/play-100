name: Screen reader smoke

on:
  workflow_dispatch:
    inputs:
      target_origin:
        description: HTTPS origin to test (production or a public candidate tunnel). Ignored when sha is set.
        type: string
        required: false
        default: https://play-100-collection.vercel.app
      sha:
        description: Full commit SHA to build (configured) and serve on 127.0.0.1 instead of a deployed origin
        type: string
        required: false
        default: ''
      suite:
        description: product runs journeys a-e; control runs the minimal native-dialog controls against the opening-speech checks
        type: choice
        required: false
        default: product
        options:
          - product
          - control

permissions:
  contents: read

concurrency:
  group: screen-reader-smoke-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.sha || inputs.target_origin }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.sha }}
  SR_SUITE: ${{ inputs.suite || 'product' }}
  TARGET_ORIGIN: ${{ inputs.sha != '' && 'http://127.0.0.1:4173' || inputs.target_origin || 'https://play-100-collection.vercel.app' }}

jobs:
  nvda:
    name: NVDA with Chrome (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: scripts/screen-reader-smoke
    env:
      SR_READER: nvda
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out the requested commit
        if: inputs.sha != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Node for the build
        if: inputs.sha != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Build the requested commit (configured)
        if: inputs.sha != ''
        working-directory: candidate
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_FIREBASE_REQUIRED: 'true'
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw "sha must be a full lowercase commit SHA: $env:CANDIDATE_SHA" }
          if ((git rev-parse HEAD) -ne $env:CANDIDATE_SHA) { throw 'The checkout is not the requested commit.' }
          foreach ($name in 'VITE_FIREBASE_API_KEY', 'VITE_FIREBASE_AUTH_DOMAIN', 'VITE_FIREBASE_PROJECT_ID', 'VITE_FIREBASE_APP_ID', 'VITE_SITE_URL') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Repository variable $name is not set; the configured build needs it." }
          }
          Remove-Item Env:CI, Env:GITHUB_SHA -ErrorAction SilentlyContinue
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Serve the build on 127.0.0.1 with the commit's Vercel emulation
        if: inputs.sha != ''
        run: |
          New-Item -ItemType Directory -Force artifacts/nvda | Out-Null
          # The runner ends processes a step starts; one created through WMI sits outside the step and keeps serving.
          $node = (Get-Command node).Source
          $here = (Get-Location).Path
          $command = "cmd.exe /c `"`"$node`" src\serve-build.ts ..\..\candidate 4173 > artifacts\nvda\serve.log 2> artifacts\nvda\serve-errors.log`""
          $created = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $command; CurrentDirectory = $here }
          if ($created.ReturnValue -ne 0) { throw "Could not start the build server: $($created.ReturnValue)" }
          foreach ($attempt in 1..60) {
            try { Invoke-WebRequest "$env:TARGET_ORIGIN/" -UseBasicParsing | Out-Null; Get-Content artifacts/nvda/serve.log -ErrorAction SilentlyContinue; exit 0 } catch { Start-Sleep 1 }
          }
          Get-Content artifacts/nvda/serve.log, artifacts/nvda/serve-errors.log -ErrorAction SilentlyContinue
          throw 'The build server did not answer within 60 seconds.'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Install pinned dependencies
        run: npm ci
      - name: Set up NVDA for automation
        run: |
          npx guidepup setup --ci
          npx guidepup install
          npx playwright install ffmpeg
      - name: Record versions
        run: |
          New-Item -ItemType Directory -Force artifacts/nvda | Out-Null
          $nvda = Get-ChildItem -Path . , $env:TEMP, $env:LOCALAPPDATA -Recurse -Depth 6 -Filter nvda.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $chrome = Get-Item "$env:ProgramFiles\Google\Chrome\Application\chrome.exe" -ErrorAction SilentlyContinue
          [ordered]@{
            nvdaPath = $nvda.FullName
            nvdaVersion = $nvda.VersionInfo.ProductVersion
            chromeVersion = $chrome.VersionInfo.ProductVersion
            os = (Get-CimInstance Win32_OperatingSystem).Caption + ' ' + [Environment]::OSVersion.Version
            imageVersion = $env:ImageVersion
          } | ConvertTo-Json | Tee-Object artifacts/nvda/system-versions.json
      - name: Fingerprint the served index.html
        run: node src/receipt.ts
      - name: Run the journeys through NVDA
        run: npx playwright test --project=nvda
      - name: Add the speech summary to the job
        if: always()
        run: |
          if (Test-Path artifacts/nvda/summary.md) { Get-Content artifacts/nvda/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY }
      - name: Upload phrase logs, versions and failure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screen-reader-nvda
          path: scripts/screen-reader-smoke/artifacts/
          if-no-files-found: error
          retention-days: 30

  voiceover:
    name: VoiceOver with Chrome (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: scripts/screen-reader-smoke
    env:
      SR_READER: voiceover
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out the requested commit
        if: inputs.sha != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Node for the build
        if: inputs.sha != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Build the requested commit (configured)
        if: inputs.sha != ''
        working-directory: candidate
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_FIREBASE_REQUIRED: 'true'
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full lowercase commit SHA: $CANDIDATE_SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_SITE_URL; do
            [[ -n "${!name}" ]] || { echo "Repository variable $name is not set; the configured build needs it."; exit 1; }
          done
          unset CI GITHUB_SHA
          npm ci --no-audit --no-fund
          npm run build
      - name: Serve the build on 127.0.0.1 with the commit's Vercel emulation
        if: inputs.sha != ''
        run: |
          mkdir -p artifacts/voiceover
          nohup node src/serve-build.ts ../../candidate 4173 > artifacts/voiceover/serve.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null "$TARGET_ORIGIN/"; then cat artifacts/voiceover/serve.log; exit 0; fi
            sleep 1
          done
          cat artifacts/voiceover/serve.log
          echo 'The build server did not answer within 60 seconds.'
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Install pinned dependencies
        run: npm ci
      - name: Set up VoiceOver for automation
        timeout-minutes: 10
        run: |
          # Without --ci, setup skips the Do Not Disturb UI script, which fails on macOS 15.7. The hosted image has SIP off,
          # so setup still enables VoiceOver AppleScript control by writing its database file.
          npx guidepup setup
          npx guidepup install
          npx playwright install ffmpeg
      - name: Record versions
        run: |
          mkdir -p artifacts/voiceover
          {
            echo "macOS: $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
            echo "VoiceOver: $(defaults read /System/Library/CoreServices/VoiceOver.app/Contents/Info CFBundleShortVersionString 2>/dev/null || echo unknown)"
            echo "Chrome: $('/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version 2>/dev/null || echo unknown)"
            echo "Image: ${ImageVersion:-unknown}"
          } | tee artifacts/voiceover/system-versions.txt
      - name: Fingerprint the served index.html
        run: node src/receipt.ts
      - name: Run the journeys through VoiceOver
        run: npx playwright test --project=voiceover
      - name: Capture the desktop on failure
        if: failure()
        run: screencapture -x artifacts/voiceover/desktop-failure.png || true
      - name: Add the speech summary to the job
        if: always()
        run: |
          if [ -f artifacts/voiceover/summary.md ]; then cat artifacts/voiceover/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload phrase logs, versions and failure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screen-reader-voiceover
          path: scripts/screen-reader-smoke/artifacts/
          if-no-files-found: error
          retention-days: 30
