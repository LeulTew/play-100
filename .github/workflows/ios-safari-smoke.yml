name: iOS Safari smoke

on:
  workflow_dispatch:
    inputs:
      target_origin:
        description: HTTPS origin to test (production or a public candidate tunnel)
        type: string
        required: true
        default: https://play-100-collection.vercel.app
      legacy_comparison:
        description: Diagnose with the previously green harness and current locked toolchain
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-safari-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  devices:
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      IOS_TARGET_ORIGIN: ${{ inputs.target_origin || 'https://play-100-collection.vercel.app' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install local gate dependencies
        run: npm ci
      - name: Check typed simulator harness and unit tests
        run: |
          npx prettier --write scripts/ios-safari-smoke .github/workflows/ios-safari-smoke.yml .github/dependabot.yml docs/ios-safari.md
          git diff --exit-code -- scripts/ios-safari-smoke .github/workflows/ios-safari-smoke.yml .github/dependabot.yml docs/ios-safari.md
          npx tsc -p tsconfig.node.json --noEmit
          npx eslint scripts/ios-safari-smoke --max-warnings 0
          npx vitest run --project unit --maxWorkers=1 scripts/ios-safari-smoke
      - name: Select installed iOS runtimes and iPhones
        id: plan
        run: |
          npx tsx scripts/ios-safari-smoke/plan.ts
      - name: Record served target build identity
        run: npx tsx scripts/ios-safari-smoke/identity.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-simulator-inventory
          path: ios-safari-artifacts/
          if-no-files-found: error
          retention-days: 30

  safari:
    needs: devices
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.devices.outputs.matrix) }}
    name: ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: ${{ matrix.developerDir }}
      IOS_RUNTIME: ${{ matrix.runtime }}
      IOS_VERSION: ${{ matrix.version }}
      IOS_DEVICE_TYPE: ${{ matrix.deviceType }}
      IOS_DEVICE_NAME: ${{ matrix.deviceName }}
      IOS_LABEL: ${{ matrix.label }}
      IOS_TARGET_ORIGIN: ${{ inputs.target_origin || 'https://play-100-collection.vercel.app' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Boot a fresh iPhone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-safari-artifacts
          xcodebuild -version | tee ios-safari-artifacts/xcode.txt
          udid=$(xcrun simctl create "Play 100 smoke" "$IOS_DEVICE_TYPE" "$IOS_RUNTIME")
          echo "IOS_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          open -a Simulator --args -CurrentDeviceUDID "$udid"
      - name: Install pinned simulator automation
        run: |
          npm ci --prefix scripts/ios-safari-smoke
          (
            cd scripts/ios-safari-smoke
            ./node_modules/.bin/appium --version
          ) | tee ios-safari-artifacts/appium-version.txt
          (
            cd scripts/ios-safari-smoke
            ./node_modules/.bin/appium driver list --installed
          ) 2>&1 | tee ios-safari-artifacts/appium-drivers.txt
      - name: Download verified prebuilt simulator agent
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) arch=arm64; sha=fc47e5334061040c5c5da660b7d7b68bcc4e7252a06c1857fcd6bc9be18cafa3 ;;
            x86_64) arch=x86_64; sha=33805030743aab14c59d8d5fc6436f6e840a09fa2c5ff697bb2e8f77923f7a33 ;;
            *) echo "::error::Unsupported simulator host architecture"; exit 1 ;;
          esac
          url="https://github.com/appium/WebDriverAgent/releases/download/v16.12.11/WebDriverAgentRunner-Build-Sim-$arch.zip"
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/wda.zip"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/wda.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/wda.zip" -d "$RUNNER_TEMP/wda"
          app="$RUNNER_TEMP/wda/WebDriverAgentRunner-Runner.app"
          echo "WDA_APP=$app" >> "$GITHUB_ENV"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          echo "WDA_BUNDLE_ID=$bundle" >> "$GITHUB_ENV"
          printf '{"version":"16.12.11","url":"%s","sha256":"%s","bundleId":"%s"}\n' "$url" "$sha" "$bundle" > ios-safari-artifacts/wda.json
      - name: Exercise production in Mobile Safari
        id: exercise
        shell: bash
        run: |
          set -euo pipefail
          (
            cd scripts/ios-safari-smoke
            exec ./node_modules/.bin/appium --address 127.0.0.1 --port 4444 --log-no-colors
          ) > ios-safari-artifacts/appium.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true; wait "$driver_pid" 2>/dev/null || true' EXIT
          if [[ "${{ inputs.legacy_comparison }}" == "true" ]]; then
            revision=60231f583bedee01c5184048b46644d3714fd7e0
            git fetch --no-tags --depth=1 https://github.com/LeulTew/play-100.git "$revision"
            mkdir -p "$RUNNER_TEMP/legacy-ios"
            for script in smoke coordinates target; do
              git show "$revision:scripts/ios-safari-smoke/$script.mjs" > "$RUNNER_TEMP/legacy-ios/$script.mjs"
            done
            printf '{"mode":"legacy-comparison","revision":"%s"}\n' "$revision" > ios-safari-artifacts/harness.json
            node "$RUNNER_TEMP/legacy-ios/smoke.mjs"
          else
            printf '{"mode":"typed","revision":"%s"}\n' "$GITHUB_SHA" > ios-safari-artifacts/harness.json
            scripts/ios-safari-smoke/node_modules/.bin/tsx scripts/ios-safari-smoke/smoke.ts
          fi
      - name: Capture simulator on failure
        if: failure() && env.IOS_UDID != ''
        run: xcrun simctl io "$IOS_UDID" screenshot ios-safari-artifacts/simulator-failure.png
      - name: Remove OAuth query strings from diagnostics
        id: redact
        if: always() && steps.exercise.outcome != 'skipped'
        run: scripts/ios-safari-smoke/node_modules/.bin/tsx scripts/ios-safari-smoke/redact.ts ios-safari-artifacts
      - name: Upload screenshots, results and diagnostics
        if: always() && (steps.exercise.outcome == 'skipped' || steps.redact.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-safari-${{ matrix.label }}
          path: |
            ios-safari-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Shut down the test simulator
        if: always() && env.IOS_UDID != ''
        run: xcrun simctl shutdown "$IOS_UDID"
