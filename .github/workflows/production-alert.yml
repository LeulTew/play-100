name: Production alert

# Hourly check of the live site and its operational probe, and the watch on the client report spike issue that the
# report functions post to (docs/release-operations.md, section 11). Only a change reaches the owner: a new or changed
# failure opens or comments on one alert issue, and a new spike post gets one acknowledgement; either fails the run,
# so GitHub emails the owner. An unchanged failure only warns. The first passing check closes its issue, and the
# spike issue closes after 24 hours without a new spike. Runs only on this public repository.
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: Report a simulated failure to test the alert channel
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: production-alert
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'LeulTew/play-100'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE: https://play-100-collection.vercel.app
      TITLE: 'Production alert: the production check failed'
      # The title used while the check ran daily, so an issue opened under it is still found.
      OLD_TITLE: 'Production alert: the daily check failed'
      SPIKE_LABEL: client-report-spike
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check the live site
        id: site
        shell: bash
        env:
          DRILL: ${{ inputs.drill == true }}
        run: |
          set -uo pipefail
          problems=''
          home=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE/" || true)
          [ "$home" = 200 ] || problems+="- The home page answered HTTP ${home:-nothing}."$'\n'
          probe=$(curl -sS -w $'\n%{http_code}' --max-time 60 "$SITE/api/operational-probe" || true)
          code=${probe##*$'\n'}
          raw=${probe%$'\n'*}
          body=$(printf '%s' "$raw" | tr -cd '[:alnum:][:space:]{}":,_-' | head -c 200)
          [ "$code" = 200 ] || problems+="- /api/operational-probe answered HTTP ${code:-nothing}: ${body:-no body}."$'\n'
          # Runs compare this state, not the text: the statuses and the probe's three results, never an error page,
          # whose request ID changes on every call. Each drill is a new state.
          health='^[{]"auth":(true|false),"wikidata":(true|false),"freetogame":(true|false)[}]$'
          [[ "$raw" =~ $health ]] || raw=other
          state="home ${home:-none}; probe ${code:-none} $raw"
          if [ "$DRILL" = true ]; then
            problems+='- Drill: a simulated failure to test this alert channel.'$'\n'
            state+="; drill $GITHUB_RUN_ID"
          fi
          printf 'problems<<ALERT_EOF\n%sALERT_EOF\n' "$problems" >> "$GITHUB_OUTPUT"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          printf '%s' "${problems:-All checks passed.}"

      - name: Report a new or changed failure
        id: report
        if: steps.site.outputs.problems != ''
        shell: bash
        env:
          PROBLEMS: ${{ steps.site.outputs.problems }}
          STATE: ${{ steps.site.outputs.state }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --limit 20 --json number,title \
            --jq "map(select(.title == \"$TITLE\" or .title == \"$OLD_TITLE\")) | .[0].number // empty")
          marker="<!-- alert-state: $(printf '%s' "$STATE" | sha256sum | cut -c1-16) -->"
          if [ -n "$existing" ]; then
            last=$( { gh issue view "$existing" --json body --jq .body
              gh api "repos/$GH_REPO/issues/$existing/comments" --paginate --jq '.[].body'; } \
              | grep -o '<!-- alert-state: [0-9a-f]* -->' | tail -n 1 || true)
            if [ "$last" = "$marker" ]; then
              echo "::warning::The production check still fails as issue #$existing reports."
              exit 0
            fi
          fi
          body=$(printf '%s\nThe production check at %s UTC failed:\n\n%s\nRun: %s\n' \
            "$marker" "$(date -u '+%Y-%m-%d %H:%M')" "$PROBLEMS" "$RUN_URL")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Close a resolved alert
        if: steps.site.outputs.problems == ''
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --limit 20 --json number,title \
            --jq "map(select(.title == \"$TITLE\" or .title == \"$OLD_TITLE\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Resolved: the check at $(date -u '+%Y-%m-%d %H:%M') UTC passed. Run: $RUN_URL"
          fi

      # The report functions post spikes with the owner's token, and GitHub doesn't notify people of their own
      # activity, so this step acknowledges each new spike post once and fails the run to reach the owner.
      - name: Watch the client report spike issue
        id: spike
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          open=$(gh api "repos/$GH_REPO/issues?state=open&labels=$SPIKE_LABEL&per_page=20" \
            --jq 'map(select(.pull_request == null) | .number) | sort | reverse | .[]')
          [ -n "$open" ] || exit 0
          issue=$(printf '%s\n' "$open" | sed -n '1p')
          # Two instances can open the issue at once. The functions post to the newest, so the others close.
          for older in $(printf '%s\n' "$open" | sed '1d'); do
            gh issue close "$older" --comment "Duplicate of #$issue, which receives the later spike posts."
          done
          created=$(gh issue view "$issue" --json createdAt --jq .createdAt)
          rows=$(gh api "repos/$GH_REPO/issues/$issue/comments" --paginate --jq '.[] | (.body // "") as $text | [
              .created_at,
              (if ($text | contains("<!-- client-report-spike -->")) then "spike" else "" end),
              ([$text | match("<!-- client-report-spike-seen: ([0-9TZ:-]+) -->") | .captures[0].string] | last // "")
            ] | @tsv')
          last=$( { echo "$created"; printf '%s\n' "$rows" | awk -F'\t' '$2 == "spike" { print $1 }'; } | sort | tail -n 1)
          seen=$(printf '%s\n' "$rows" | awk -F'\t' '$3 != "" { print $3 }' | sort | tail -n 1)
          last_s=$(date -u -d "$last" +%s)
          seen_s=0
          [ -z "$seen" ] || seen_s=$(date -u -d "$seen" +%s)
          if [ "$last_s" -gt "$seen_s" ]; then
            gh issue comment "$issue" --body "$(printf '<!-- client-report-spike-seen: %s -->\nA new client error or CSP report spike was posted at %s UTC (above). Run: %s\n' "$last" "$last" "$RUN_URL")"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif [ $(( $(date -u +%s) - last_s )) -ge 86400 ]; then
            gh issue close "$issue" --comment "Closed: no new client error or CSP report spike for 24 hours (the last at $last UTC). Run: $RUN_URL"
          fi

      - name: Fail on a new or changed alert
        if: steps.report.outputs.changed == 'true' || steps.spike.outputs.changed == 'true'
        shell: bash
        run: |
          echo '::error::A new or changed production alert was reported; see the alert issues.'
          exit 1