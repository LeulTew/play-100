name: Production alert

# Hourly check of the live site and its operational probe, and the watch on the client report spike issue that the
# report functions post to (docs/release-operations.md, section 11). Only a change reaches the owner: a new or changed
# failure opens or comments on one alert issue, and a new spike post gets one acknowledgement; either fails the run,
# so GitHub emails the owner. An unchanged failure only warns. The first passing check closes its issue, and the
# spike issue closes after 24 hours without a new spike. The repository is public, so only this workflow's own issue
# and comments, and the spike issue and posts made with the owner's token, count; alert issues are locked to
# collaborators. Runs only on this public repository.
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: Report a simulated failure to test the alert channel
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: production-alert
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'LeulTew/play-100'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE: https://play-100-collection.vercel.app
      TITLE: 'Production alert: the production check failed'
      # Titles this workflow used before the label, so an issue it opened under them is still found.
      OLD_TITLE: 'Production alert: the daily check failed'
      CHECK_LABEL: production-check-failed
      SPIKE_LABEL: client-report-spike
      BOT: github-actions[bot]
      # The report functions post spikes with a token of the repository's owner.
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check the live site
        id: site
        shell: bash
        env:
          DRILL: ${{ inputs.drill == true }}
        run: |
          set -uo pipefail
          problems=''
          home=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE/" || true)
          [ "$home" = 200 ] || problems+="- The home page answered HTTP ${home:-nothing}."$'\n'
          probe=$(curl -sS -w $'\n%{http_code}' --max-time 60 "$SITE/api/operational-probe" || true)
          code=${probe##*$'\n'}
          raw=${probe%$'\n'*}
          body=$(printf '%s' "$raw" | tr -cd '[:alnum:][:space:]{}":,_-' | head -c 200)
          [ "$code" = 200 ] || problems+="- /api/operational-probe answered HTTP ${code:-nothing}: ${body:-no body}."$'\n'
          # Runs compare this state, not the text: the statuses and the probe's three results, never an error page,
          # whose request ID changes on every call. Each drill is a new state.
          health='^[{]"auth":(true|false),"wikidata":(true|false),"freetogame":(true|false)[}]$'
          [[ "$raw" =~ $health ]] || raw=other
          state="home ${home:-none}; probe ${code:-none} $raw"
          if [ "$DRILL" = true ]; then
            problems+='- Drill: a simulated failure to test this alert channel.'$'\n'
            state+="; drill $GITHUB_RUN_ID"
          fi
          printf 'problems<<ALERT_EOF\n%sALERT_EOF\n' "$problems" >> "$GITHUB_OUTPUT"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          printf '%s' "${problems:-All checks passed.}"

      - name: Define the issue helpers
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/alert-issues.sh" <<'HELPERS'
          # Sourced by the steps below. The repository is public, so anyone can open an issue or comment: only issues
          # and comments by $BOT, and spike issues and posts by $OWNER, are ever read.
          set -euo pipefail
          shopt -s inherit_errexit
          # Prints "<number> <locked>" for the newest open production-check issue this workflow opened.
          check_issue() {
            gh api "repos/$GH_REPO/issues?state=open&per_page=100" --paginate --jq '.[] | select(.pull_request == null
              and .user.login == "'"$BOT"'" and (any(.labels[]; .name == "'"$CHECK_LABEL"'")
              or .title == "'"$TITLE"'" or .title == "'"$OLD_TITLE"'")) | "\(.number) \(.locked)"' | sort -rn | sed -n 1p
          }
          # Prints "<created_at>\t<login>\t<first line>" for issue $1's body and then each comment, oldest first.
          posts() {
            local row='[.created_at, (.user.login | ascii_downcase), ((.body // "") | split("\n")[0] | rtrimstr("\r"))] | @tsv'
            gh api "repos/$GH_REPO/issues/$1" --jq "$row"
            gh api "repos/$GH_REPO/issues/$1/comments" --paginate --jq ".[] | $row"
          }
          # $BOT can't comment on a locked issue, so it unlocks the issue around each comment and locks it again.
          comment() {
            gh issue unlock "$1" >/dev/null
            gh issue comment "$1" --body "$2" >/dev/null
            gh issue lock "$1" >/dev/null
          }
          close() {
            gh issue unlock "$1" >/dev/null
            gh issue close "$1" --comment "$2" >/dev/null
            gh issue lock "$1" >/dev/null
          }
          # gh issue lock fails on an issue that is already locked.
          lock() { [ "$2" = true ] || gh issue lock "$1" >/dev/null; }
          stamp='[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z'
          HELPERS

      - name: Report a new or changed failure
        id: report
        if: steps.site.outputs.problems != ''
        shell: bash
        env:
          PROBLEMS: ${{ steps.site.outputs.problems }}
          STATE: ${{ steps.site.outputs.state }}
        run: |
          . "$RUNNER_TEMP/alert-issues.sh"
          found=$(check_issue)
          read -r number locked <<<"$found"
          marker="<!-- alert-state: $(printf '%s' "$STATE" | sha256sum | cut -c1-16) -->"
          if [ -n "$number" ]; then
            rows=$(posts "$number")
            last=''
            while IFS=$'\t' read -r _ login first; do
              if [ "$login" = "${BOT,,}" ] && [[ "$first" =~ ^'<!-- alert-state: '[0-9a-f]{16}' -->'$ ]]; then last=$first; fi
            done <<<"$rows"
            if [ "$last" = "$marker" ]; then
              lock "$number" "$locked"
              echo "::warning::The production check still fails as issue #$number reports."
              exit 0
            fi
          fi
          body=$(printf '%s\nThe production check at %s UTC failed:\n\n%s\nRun: %s\n' \
            "$marker" "$(date -u '+%Y-%m-%d %H:%M')" "$PROBLEMS" "$RUN_URL")
          if [ -n "$number" ]; then
            comment "$number" "$body"
          else
            gh label create "$CHECK_LABEL" --force --color B60205 --description 'The hourly production check failed' >/dev/null
            number=$(gh api "repos/$GH_REPO/issues" -f title="$TITLE" -f body="$body" -f "labels[]=$CHECK_LABEL" --jq .number)
            gh issue lock "$number" >/dev/null
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Close a resolved alert
        if: steps.site.outputs.problems == ''
        shell: bash
        run: |
          . "$RUNNER_TEMP/alert-issues.sh"
          found=$(check_issue)
          [ -n "$found" ] || exit 0
          read -r number _ <<<"$found"
          close "$number" "Resolved: the check at $(date -u '+%Y-%m-%d %H:%M') UTC passed. Run: $RUN_URL"

      # The report functions post spikes with the owner's token, and GitHub doesn't notify people of their own
      # activity, so this step acknowledges each new spike post once and fails the run to reach the owner.
      - name: Watch the client report spike issue
        id: spike
        shell: bash
        run: |
          . "$RUNNER_TEMP/alert-issues.sh"
          found=$(gh api "repos/$GH_REPO/issues?state=open&labels=$SPIKE_LABEL&creator=$OWNER&per_page=100" --paginate \
            --jq '.[] | select(.pull_request == null and (.user.login | ascii_downcase) == "'"${OWNER,,}"'")
              | "\(.number) \(.locked)"' | sort -rn)
          [ -n "$found" ] || exit 0
          mapfile -t open <<<"$found"
          read -r issue locked <<<"${open[0]}"
          # Two instances can open the issue at once. The functions post to the newest, so the others close.
          for row in "${open[@]:1}"; do
            close "${row%% *}" "Duplicate of #$issue, which receives the later spike posts."
          done
          rows=$(posts "$issue")
          last='' seen=''
          while IFS=$'\t' read -r at login first; do
            if [ "$login" = "${OWNER,,}" ] && [ "$first" = '<!-- client-report-spike -->' ] && [[ "$at" =~ ^$stamp$ ]]; then
              if [[ "$at" > "$last" ]]; then last=$at; fi
            elif [ "$login" = "${BOT,,}" ] && [[ "$first" =~ ^'<!-- client-report-spike-seen: '($stamp)' -->'$ ]]; then
              if [[ "${BASH_REMATCH[1]}" > "$seen" ]]; then seen=${BASH_REMATCH[1]}; fi
            fi
          done <<<"$rows"
          if [ -n "$last" ] && [[ "$last" > "$seen" ]]; then
            comment "$issue" "$(printf '<!-- client-report-spike-seen: %s -->\nA new client error or CSP report spike was posted at %s UTC (above). Run: %s\n' "$last" "$last" "$RUN_URL")"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -ge 86400 ]; then
            close "$issue" "Closed: no new client error or CSP report spike for 24 hours (the last at $last UTC). Run: $RUN_URL"
          else
            lock "$issue" "$locked"
          fi

      - name: Fail on a new or changed alert
        if: steps.report.outputs.changed == 'true' || steps.spike.outputs.changed == 'true'
        shell: bash
        run: |
          echo '::error::A new or changed production alert was reported; see the alert issues.'
          exit 1
