name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          release="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          checksums="gitleaks_8.30.1_checksums.txt"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$checksums" "$release/$checksums"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" "$release/$archive"
          printf '%s  %s\n' \
            '061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae' "$checksums" \
            | sha256sum --check --strict
          grep --fixed-strings --line-regexp \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" "$checksums" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks
          chmod +x gitleaks
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan Git history with redacted findings
        run: gitleaks git --redact --config .gitleaks.toml --exit-code 1 .
