name: Candidate CI

# Heavy test work for one exact candidate commit on a GitHub-hosted Linux runner: Playwright loops, the Firestore
# rules and cloud-UI suites against the Firebase emulators, and Lighthouse on the production build. It complements the
# local release gate and does not replace it (docs/release-operations.md, "Candidate CI runs").
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA of the candidate to test
        type: string
        required: true
      suite:
        description: Suite to run
        type: choice
        required: true
        options:
          - e2e-prod
          - e2e-dev
          - e2e-offline
          - cloud-rules
          - cloud-ui
          - lighthouse
          - checks
          - csp-refresh
          - floor
      specs:
        description: Space-separated spec paths (empty runs the suite's whole config)
        type: string
        required: false
        default: ''
      project:
        description: Playwright project (ignored by cloud-rules, lighthouse and floor, which runs all three floor engines)
        type: choice
        required: false
        default: both
        options:
          - both
          - desktop
          - mobile
      repeat:
        description: Playwright --repeat-each; for cloud-rules, fresh-emulator iterations
        type: string
        required: false
        default: '1'
      workers:
        description: Worker count (empty uses the suite default, 3 for e2e and 1 for cloud)
        type: string
        required: false
        default: ''
      grep:
        description: Optional test title filter (Playwright --grep, Vitest -t)
        type: string
        required: false
        default: ''
      browser_env:
        description: >-
          Playwright browser environment: auto (headed under Xvfb for e2e-dev, mobile-only headed under Xvfb for e2e-offline, the config as is otherwise), the config as is, Chromium with background throttling off (added launch args), headed under Xvfb, or only the mobile project headed under Xvfb
        type: choice
        required: false
        default: auto
        options:
          - auto
          - default
          - unthrottled
          - xvfb-headed
          - xvfb-headed-mobile
      request:
        description: >-
          Optional request id (letters, digits, dot, underscore, hyphen; at most 64) that npm run ci:dispatch puts in
          the run name and identity.json to find this run among concurrent dispatches
        type: string
        required: false
        default: ''

run-name: Candidate CI ${{ inputs.suite }} ${{ inputs.project }} ${{ inputs.sha }} ${{ inputs.request }}

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.suite }} ${{ inputs.project }} @ ${{ inputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SUITE: ${{ inputs.suite }}
      SPECS: ${{ inputs.specs }}
      PROJECT: ${{ inputs.project }}
      REPEAT: ${{ inputs.repeat }}
      WORKERS: ${{ inputs.workers }}
      GREP: ${{ inputs.grep }}
      BROWSER_ENV: ${{ inputs.browser_env }}
      REQUESTED_SHA: ${{ inputs.sha }}
      REQUEST_ID: ${{ inputs.request }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      OUT: ${{ github.workspace }}/evidence
      CI_TOOLS: ${{ github.workspace }}/_ci/.github/candidate-ci
      # Typed helpers from the workflow's own ref, run with the candidate's tsx so they work at any SHA.
      CI_SCRIPTS: ${{ github.workspace }}/_ci/scripts/candidate-ci
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character lowercase SHA"; exit 1; }
          [[ "$REPEAT" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "repeat must be 1-999"; exit 1; }
          [[ -z "$WORKERS" || "$WORKERS" =~ ^[1-9][0-9]?$ ]] || { echo "workers must be empty or 1-99"; exit 1; }
          for spec in $SPECS; do
            [[ "$spec" =~ ^[A-Za-z0-9._/-]+(:[0-9]+)?$ && "$spec" != *..* ]] || { echo "Unsafe spec path: $spec"; exit 1; }
          done
          [[ "$GREP" != *$'\n'* ]] || { echo "grep must be one line"; exit 1; }
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{0,64}$ ]] || { echo "request must be at most 64 of [A-Za-z0-9._-]"; exit 1; }

      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          path: candidate
          # The checks suite's budget-policy unit test reads the released commits named in docs/releases.md.
          fetch-depth: ${{ inputs.suite == 'checks' && '0' || '1' }}
          persist-credentials: false

      - name: Check out the CI tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: _ci
          persist-credentials: false
          # The root package.json ("type": "module") makes tsx load the helpers as ESM.
          sparse-checkout: |
            /package.json
            .github/candidate-ci
            scripts/candidate-ci
          sparse-checkout-cone-mode: false

      - name: Confirm the exact commit
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git status --porcelain --untracked-files=all | (! grep .)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: inputs.suite == 'cloud-rules' || inputs.suite == 'cloud-ui'
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: candidate
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund

      - name: Install Lighthouse (pinned by its own lockfile)
        if: inputs.suite == 'lighthouse'
        run: npm ci --prefix "$CI_TOOLS/lighthouse" --no-audit --no-fund

      - name: Install the Playwright browser
        if: inputs.suite != 'cloud-rules' && inputs.suite != 'csp-refresh'
        working-directory: candidate
        run: npx --no-install playwright install --with-deps chromium ${{ inputs.suite == 'floor' && 'firefox webkit' || '' }}

      # The floor smoke's old Chromium: the official snapshot at the Chrome 106 branch-base position (1036826, Chromium
      # 106.0.5249.0), pinned by SHA-256 (Google's stored MD5 for the object matches too).
      - name: Cache the floor Chromium
        if: inputs.suite == 'floor'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/floor-chromium
          key: floor-chromium-linux-1036826-5377b504a94f648108f07c2edc819f2621e7ebf37669b986e462fa80af577584

      - name: Install the floor Chromium
        if: inputs.suite == 'floor'
        env:
          FLOOR_DIR: ${{ runner.temp }}/floor-chromium
          FLOOR_URL: https://commondatastorage.googleapis.com/chromium-browser-snapshots/Linux_x64/1036826/chrome-linux.zip
          FLOOR_SHA256: 5377b504a94f648108f07c2edc819f2621e7ebf37669b986e462fa80af577584
        run: |
          set -euo pipefail
          mkdir -p "$FLOOR_DIR"
          if [[ ! -f "$FLOOR_DIR/chrome-linux.zip" ]]; then curl -fsSL --retry 3 -o "$FLOOR_DIR/chrome-linux.zip" "$FLOOR_URL"; fi
          echo "$FLOOR_SHA256  $FLOOR_DIR/chrome-linux.zip" | sha256sum -c -
          rm -rf "$FLOOR_DIR/chrome-linux"
          unzip -q "$FLOOR_DIR/chrome-linux.zip" -d "$FLOOR_DIR"
          "$FLOOR_DIR/chrome-linux/chrome" --version
          echo "PLAY100_FLOOR_CHROMIUM=$FLOOR_DIR/chrome-linux/chrome" >> "$GITHUB_ENV"

      - name: Build (configured)
        if: inputs.suite == 'e2e-prod' || inputs.suite == 'lighthouse' || inputs.suite == 'floor'
        working-directory: candidate
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_FIREBASE_REQUIRED: 'true'
        run: |
          set -euo pipefail
          unset CI GITHUB_SHA
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_SITE_URL; do
            [[ -n "${!name}" ]] || { echo "Repository variable $name is not set; the configured build needs it."; exit 1; }
          done
          npm run build
          echo "BUILD_PROFILE=configured" >> "$GITHUB_ENV"

      - name: Build (offline)
        if: inputs.suite == 'e2e-offline'
        working-directory: candidate
        run: |
          set -euo pipefail
          unset CI GITHUB_SHA
          npm run build
          echo "BUILD_PROFILE=offline" >> "$GITHUB_ENV"

      - name: Run ${{ inputs.suite }}
        id: suite
        working-directory: candidate
        env:
          # The configured suites' specs read the public Firebase configuration, which the gate's .env.local supplies
          # locally: e2e-prod and floor test the configured build, e2e-dev the configured dev server, and csp-refresh
          # builds it.
          VITE_FIREBASE_API_KEY: ${{ contains(fromJSON('["e2e-prod","e2e-dev","csp-refresh","floor"]'), inputs.suite) && vars.VITE_FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ contains(fromJSON('["e2e-prod","e2e-dev","csp-refresh","floor"]'), inputs.suite) && vars.VITE_FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ contains(fromJSON('["e2e-prod","e2e-dev","csp-refresh","floor"]'), inputs.suite) && vars.VITE_FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_APP_ID: ${{ contains(fromJSON('["e2e-prod","e2e-dev","csp-refresh","floor"]'), inputs.suite) && vars.VITE_FIREBASE_APP_ID || '' }}
          VITE_SITE_URL: ${{ contains(fromJSON('["e2e-prod","e2e-dev","csp-refresh","floor"]'), inputs.suite) && vars.VITE_SITE_URL || '' }}
          VITE_FIREBASE_REQUIRED: ${{ contains(fromJSON('["e2e-prod","e2e-dev","csp-refresh","floor"]'), inputs.suite) && 'true' || '' }}
        run: |
          set -euo pipefail
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_SITE_URL VITE_FIREBASE_REQUIRED; do
            [[ -n "${!name}" ]] || unset "$name"
          done
          bash "$CI_TOOLS/run-suite.sh"

      - name: Record identity
        if: always() && steps.suite.outcome != 'skipped'
        working-directory: candidate
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          LIGHTHOUSE_DIR: ${{ inputs.suite == 'lighthouse' && format('{0}/lighthouse', env.CI_TOOLS) || '' }}
          FONT_CELLS_DIR: ${{ inputs.suite == 'lighthouse' && format('{0}/lighthouse', env.OUT) || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if [[ "$SUITE" == cloud-* ]] && command -v java >/dev/null; then export JAVA_VERSION_LINE="$(java -version 2>&1 | head -n 1)"; fi
          for log in firebase-debug.log firestore-debug.log; do
            if [[ -f "$log" ]]; then cp "$log" "$OUT/"; fi
          done
          # Written last: its `files` array digests every other file in the artifact.
          npx --no-install tsx "$CI_SCRIPTS/identity.ts" "$OUT/identity.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-ci-${{ inputs.suite }}-${{ inputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Extract failures
        id: failures
        if: always() && steps.suite.outcome == 'failure'
        working-directory: candidate
        run: |
          set -euo pipefail
          npx --no-install tsx "$CI_SCRIPTS/failures.ts" "$OUT" "$RUNNER_TEMP/failures"
          if [[ -f "$RUNNER_TEMP/failures/failures.json" ]]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      # Small companion to the full artifact: each failed test's error-context.md, screenshots and failures.json,
      # without traces, so a failure can be read without downloading the full evidence.
      - name: Upload failures
        if: always() && steps.failures.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failures-${{ inputs.suite }}-${{ inputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failures/
          if-no-files-found: error
          retention-days: 30
