name: Candidate CI

# Heavy test work for one exact candidate commit on a GitHub-hosted Linux runner: Playwright loops, the Firestore
# rules and cloud-UI suites against the Firebase emulators, and Lighthouse on the production build. It complements the
# local release gate and does not replace it (docs/release-operations.md, "Candidate CI runs").
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA of the candidate to test
        type: string
        required: true
      suite:
        description: Suite to run
        type: choice
        required: true
        options:
          - e2e-prod
          - e2e-dev
          - e2e-offline
          - cloud-rules
          - cloud-ui
          - lighthouse
      specs:
        description: Space-separated spec paths (empty runs the suite's whole config)
        type: string
        required: false
        default: ''
      project:
        description: Playwright project (ignored by cloud-rules and lighthouse)
        type: choice
        required: false
        default: both
        options:
          - both
          - desktop
          - mobile
      repeat:
        description: Playwright --repeat-each; for cloud-rules, fresh-emulator iterations
        type: string
        required: false
        default: '1'
      workers:
        description: Worker count (empty uses the suite default, 3 for e2e and 1 for cloud)
        type: string
        required: false
        default: ''
      grep:
        description: Optional test title filter (Playwright --grep, Vitest -t)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.suite }} ${{ inputs.project }} @ ${{ inputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SUITE: ${{ inputs.suite }}
      SPECS: ${{ inputs.specs }}
      PROJECT: ${{ inputs.project }}
      REPEAT: ${{ inputs.repeat }}
      WORKERS: ${{ inputs.workers }}
      GREP: ${{ inputs.grep }}
      REQUESTED_SHA: ${{ inputs.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      OUT: ${{ github.workspace }}/evidence
      CI_TOOLS: ${{ github.workspace }}/_ci/.github/candidate-ci
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character lowercase SHA"; exit 1; }
          [[ "$REPEAT" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "repeat must be 1-999"; exit 1; }
          [[ -z "$WORKERS" || "$WORKERS" =~ ^[1-9][0-9]?$ ]] || { echo "workers must be empty or 1-99"; exit 1; }
          for spec in $SPECS; do
            [[ "$spec" =~ ^[A-Za-z0-9._/-]+(:[0-9]+)?$ && "$spec" != *..* ]] || { echo "Unsafe spec path: $spec"; exit 1; }
          done
          [[ "$GREP" != *$'\n'* ]] || { echo "grep must be one line"; exit 1; }

      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out the CI tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: _ci
          persist-credentials: false
          sparse-checkout: .github/candidate-ci
          sparse-checkout-cone-mode: false

      - name: Confirm the exact commit
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git status --porcelain --untracked-files=all | (! grep .)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: inputs.suite == 'cloud-rules' || inputs.suite == 'cloud-ui'
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: candidate
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund

      - name: Install Lighthouse (pinned by its own lockfile)
        if: inputs.suite == 'lighthouse'
        run: npm ci --prefix "$CI_TOOLS/lighthouse" --no-audit --no-fund

      - name: Install the Playwright browser
        if: inputs.suite != 'cloud-rules'
        working-directory: candidate
        run: npx --no-install playwright install --with-deps chromium

      - name: Build (configured)
        if: inputs.suite == 'e2e-prod' || inputs.suite == 'lighthouse'
        working-directory: candidate
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_FIREBASE_REQUIRED: 'true'
        run: |
          set -euo pipefail
          unset CI GITHUB_SHA
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_SITE_URL; do
            [[ -n "${!name}" ]] || { echo "Repository variable $name is not set; the configured build needs it."; exit 1; }
          done
          npm run build
          echo "BUILD_PROFILE=configured" >> "$GITHUB_ENV"

      - name: Build (offline)
        if: inputs.suite == 'e2e-offline'
        working-directory: candidate
        run: |
          set -euo pipefail
          unset CI GITHUB_SHA
          npm run build
          echo "BUILD_PROFILE=offline" >> "$GITHUB_ENV"

      - name: Run ${{ inputs.suite }}
        id: suite
        working-directory: candidate
        env:
          # The development suite runs against the configured dev server, as the gate's development step does.
          VITE_FIREBASE_API_KEY: ${{ inputs.suite == 'e2e-dev' && vars.VITE_FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ inputs.suite == 'e2e-dev' && vars.VITE_FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ inputs.suite == 'e2e-dev' && vars.VITE_FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_APP_ID: ${{ inputs.suite == 'e2e-dev' && vars.VITE_FIREBASE_APP_ID || '' }}
          VITE_SITE_URL: ${{ inputs.suite == 'e2e-dev' && vars.VITE_SITE_URL || '' }}
          VITE_FIREBASE_REQUIRED: ${{ inputs.suite == 'e2e-dev' && 'true' || '' }}
        run: |
          set -euo pipefail
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_SITE_URL VITE_FIREBASE_REQUIRED; do
            [[ -n "${!name}" ]] || unset "$name"
          done
          bash "$CI_TOOLS/run-suite.sh"

      - name: Record identity
        if: always() && steps.suite.outcome != 'skipped'
        working-directory: candidate
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          LIGHTHOUSE_DIR: ${{ inputs.suite == 'lighthouse' && format('{0}/lighthouse', env.CI_TOOLS) || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if [[ "$SUITE" == cloud-* ]] && command -v java >/dev/null; then export JAVA_VERSION_LINE="$(java -version 2>&1 | head -n 1)"; fi
          node "$CI_TOOLS/identity.mjs" "$OUT/identity.json"
          for log in firebase-debug.log firestore-debug.log; do
            if [[ -f "$log" ]]; then cp "$log" "$OUT/"; fi
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-ci-${{ inputs.suite }}-${{ inputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
