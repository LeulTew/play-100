name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit signatures
      - run: npm run lint
      - run: npx --no-install tsc -b
      - run: npm run typecheck:functions
      # npm test includes real-browser fixtures; several explicitly use Chrome.
      - name: Install browsers for mounted tests
        run: npx --no-install playwright install --with-deps chromium chrome
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npm run check:budgets -- --json budget-report.json
      - name: Upload budget report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budget-report
          path: budget-report.json
          retention-days: 30
          if-no-files-found: warn
      - run: npm run validate:data
      - run: npm run validate:discovery

  e2e:
    name: Browser (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [production, development]
    env:
      PLAY100_TEST_BUILD: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit signatures
      # Chrome is also required by the native zoom and H.264 film cases.
      - run: npx --no-install playwright install --with-deps chromium chrome
      - if: matrix.suite == 'production'
        run: npm run build
      - run: npm run test:e2e
      - name: Upload failure report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false

  emulators:
    name: Auth and Firestore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm audit signatures
      # Uses the local firebase-tools version pinned by package-lock.json.
      # The existing script selects demo-play100 and only Auth/Firestore.
      - run: npm run test:cloud
