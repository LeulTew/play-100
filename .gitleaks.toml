title = "Play 100 full-history CI secret scanning"

[extend]
useDefault = true

[[rules]]
id = "linkedin-client-id"

[[rules.allowlists]]
description = "A public author-config property name adjacent to linkedinUrl, not an OAuth credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^telegramHandle$''']
paths = ['''(^|/)data/generate_collection\.py$''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "A sessionStorage key name for recorded CSP violations, not a credential."
condition = "AND"
regexTarget = "secret"
regexes = ['''^p100\.csp-violations$''']
paths = ['''(^|/)tests/csp-violation-helpers\.ts$''']
